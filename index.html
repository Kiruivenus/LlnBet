<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LlnBet | Premium Live Sportsbook & Betting Platform</title>
  <meta name="description" content="LlnBet offers a premium, modern, and ultra-fast sports betting experience with live score updates, flashing odds, instantly syncable betslips, and customized user dashboards. Play responsibly.">
  
  <!-- SEO & OpenGraph Meta Tags -->
  <meta property="og:title" content="LlnBet | Premium Live Sportsbook">
  <meta property="og:description" content="Experience premium online sports betting. Live timers, interactive stats, real-time payouts, and advanced betslip parlay calculators.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/img/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LlnBet | Premium Live Sportsbook">
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <!-- Google Material Icons Round -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  
  <!-- Schema.org structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsActivityLocation",
      "name": "LlnBet Sportsbook",
      "description": "Premium Sports Betting Platform",
      "url": "https://llnbet.com",
      "logo": "/img/logo.png",
      "knowsAbout": ["Sports Betting", "Live Betting", "Casino", "Jackpots"]
    }
  </script>
</head>
<body>

  <!-- Dynamic Betika-style App Splash Loader -->
  <div id="app-splash-loader" class="splash-loader-overlay">
    <div class="splash-loader-content">
      <div class="splash-logo" style="background:none; box-shadow:none;"><img src="/img/logo.png" style="height:90px; width:auto; border-radius:12px; animation: pulse 1.8s infinite ease-in-out;" alt="LlnBet Logo" /></div>
      <div class="splash-line-loader">
        <div class="splash-line-progress"></div>
      </div>
    </div>
  </div>

  <!-- App Shell -->
  <div class="app-shell">
    
    <!-- Sticky Header -->
    <header class="app-header" id="app-header"></header>
    
    <!-- Left Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar"></aside>
    
    <!-- Main Betting Content Area -->
    <main class="app-main" id="app-main">
      <!-- Loading Skeleton / Dynamic content renders here -->
      <div style="display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary);">
        <img src="/img/logo.png" style="width: 60px; height: 60px; border-radius:12px; object-fit:cover;" alt="LlnBet Logo" />
        <p style="font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.1em; text-transform: uppercase; animation: pulse-opacity 1s infinite alternate;">Connecting to LlnBet...</p>
      </div>
    </main>
    
    <!-- Right Betslip Panel -->
    <aside class="app-betslip" id="app-betslip"></aside>
    
    <!-- Mobile Bottom Navigation Bar (Visible on <= 1200px viewports) -->
    <nav class="mobile-nav-bar" id="mobile-nav-bar"></nav>
    
  </div>

  <!-- Search Modal Overlay -->
  <div class="search-modal" id="search-modal"></div>

  <!-- Custom BetPulse Global Alert Modal -->
  <div id="betpulse-alert-modal" class="custom-alert-overlay" style="display: none;">
    <div class="custom-alert-card">
      <div class="custom-alert-icon">
        <span class="material-icons-round">info</span>
      </div>
      <div class="custom-alert-body">
        <h3 class="custom-alert-title">Notification</h3>
        <p class="custom-alert-message" id="betpulse-alert-message"></p>
      </div>
      <button class="custom-alert-btn" id="betpulse-alert-ok-btn">OK</button>
    </div>
  </div>

  <!-- Custom BetPulse Global Confirm Modal -->
  <div id="betpulse-confirm-modal" class="custom-alert-overlay" style="display: none;">
    <div class="custom-alert-card">
      <div class="custom-alert-icon" style="background: rgba(255, 61, 0, 0.1); color: var(--accent-live);">
        <span class="material-icons-round">warning</span>
      </div>
      <div class="custom-alert-body">
        <h3 class="custom-alert-title">Security Warning</h3>
        <p class="custom-alert-message" id="betpulse-confirm-message"></p>
      </div>
      <div style="display:flex; width:100%; gap:12px;">
        <button class="quick-stake-btn" id="betpulse-confirm-cancel-btn" style="flex:1; padding:12px; font-weight:800; border-radius:var(--radius-md); background:none; border:1px solid var(--border-color); color:var(--text-secondary); cursor:pointer; outline:none;">Cancel</button>
        <button class="custom-alert-btn" id="betpulse-confirm-yes-btn" style="flex:1; padding:12px; font-weight:800; border-radius:var(--radius-md); background:linear-gradient(to right, var(--accent-emerald), var(--accent-orange)); border:none; color:var(--bg-obsidian); cursor:pointer;">Proceed</button>
      </div>
    </div>
  </div>

  <!-- JS Bootstrapper Module -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
